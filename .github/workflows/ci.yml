name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  worker-validation:
    name: Worker validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        run: npm ci

      - name: Check Worker TypeScript
        run: npm run check

      - name: Run Worker unit and contract tests
        run: npm test

      - name: Run isolated PostgreSQL integration and baseline replay
        run: npm run test:isolated-postgres

      - name: Build Worker dry-run artifact
        run: npm run build

      - name: Audit Worker dependencies
        run: npm audit --audit-level=high

  worker-frontend-e2e:
    name: Frontend E2E against Worker
    runs-on: ubuntu-latest
    needs: worker-validation
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            frontend/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify Pages same-origin API proxy
        working-directory: frontend
        run: npm run test:functions

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run full Frontend E2E against disposable Worker PostgreSQL
        working-directory: worker
        run: npm run test:local-e2e

      - name: Upload Worker Playwright report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: worker-playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Worker E2E test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: worker-e2e-test-results
          path: frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

  production-deploy:
    name: Production Cloudflare deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - worker-frontend-e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT_NAME: ${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
      CLOUDFLARE_WORKER_NAME: ${{ secrets.CLOUDFLARE_PRODUCTION_WORKER_NAME }}
      CLOUDFLARE_INGRESS_RATE_LIMIT_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_INGRESS_RATE_LIMIT_NAMESPACE_ID }}
      CLOUDFLARE_READ_RATE_LIMIT_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_READ_RATE_LIMIT_NAMESPACE_ID }}
      CLOUDFLARE_WRITE_RATE_LIMIT_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_PRODUCTION_WRITE_RATE_LIMIT_NAMESPACE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Mask deployment identifiers
        uses: ./.github/actions/mask-cloudflare-identifiers

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            worker/package-lock.json
            frontend/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify production database identity and migration ledger
        working-directory: worker
        env:
          NEON_MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          NEON_MIGRATION_EXPECTED_HOST: ${{ secrets.NEON_MIGRATION_EXPECTED_HOST }}
          NEON_MIGRATION_EXPECTED_DATABASE: ${{ secrets.NEON_MIGRATION_EXPECTED_DATABASE }}
          NEON_MIGRATION_EXPECTED_ROLE: ${{ secrets.NEON_MIGRATION_EXPECTED_ROLE }}
        run: npm run migrate:production:preflight

      - name: Validate production deployment configuration
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:validate

      - name: Verify configured production targets exist
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:verify-targets

      - name: Build Frontend production artifact
        working-directory: frontend
        run: npm run build

      - name: Apply pending production database migrations
        working-directory: worker
        env:
          NEON_MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          NEON_MIGRATION_EXPECTED_HOST: ${{ secrets.NEON_MIGRATION_EXPECTED_HOST }}
          NEON_MIGRATION_EXPECTED_DATABASE: ${{ secrets.NEON_MIGRATION_EXPECTED_DATABASE }}
          NEON_MIGRATION_EXPECTED_ROLE: ${{ secrets.NEON_MIGRATION_EXPECTED_ROLE }}
        run: npm run migrate:production:apply

      - name: Verify production migration ledger and V2 schema
        working-directory: worker
        env:
          NEON_MIGRATION_DATABASE_URL: ${{ secrets.NEON_MIGRATION_DATABASE_URL }}
          NEON_MIGRATION_EXPECTED_HOST: ${{ secrets.NEON_MIGRATION_EXPECTED_HOST }}
          NEON_MIGRATION_EXPECTED_DATABASE: ${{ secrets.NEON_MIGRATION_EXPECTED_DATABASE }}
          NEON_MIGRATION_EXPECTED_ROLE: ${{ secrets.NEON_MIGRATION_EXPECTED_ROLE }}
        run: npm run migrate:production:verify

      - name: Deploy production Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_DEPLOY_REDACT_OUTPUT: 'true'
        run: npm run deploy:production

      - name: Deploy production Pages
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm run deploy:pages:production

      - name: Run production same-origin read-only smoke
        working-directory: worker
        run: npm run deploy:smoke:production
